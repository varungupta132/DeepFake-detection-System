[phases.setup]
nixPkgs = ["nodejs_18", "python311", "python311Packages.pip", "libGL", "libGLU", "glib"]

[phases.install]
cmds = [
  "cd node-backend && npm install",
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r backend/requirements.txt"
]

[start]
cmd = "cd node-backend && node server.js"
