[phases.setup]
nixPkgs = ["nodejs_18", "python311", "python311Packages.pip", "libGL", "libGLU", "glib", "zlib"]

[phases.install]
cmds = [
  "(cd node-backend && npm install)",
  "pip install --break-system-packages -r backend/requirements.txt"
]

[start]
cmd = "export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/nix/store/$(ls /nix/store | grep -m1 zlib)/lib && cd node-backend && node server.js"
